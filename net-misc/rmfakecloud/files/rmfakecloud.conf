# Configuration for rmfakecloud, read by both the OpenRC and systemd services.
# Full reference: https://ddvk.github.io/rmfakecloud/install/configuration/

# Secret used to sign auth tokens. If unset a random one is generated at each
# start, which logs out every device. Generate one with:
#   openssl rand -base64 48
JWT_SECRET_KEY=

# Address of this server as seen from the tablet (protocol, host, port).
#STORAGE_URL=https://rmfakecloud.example.com

PORT=3000
DATADIR=/var/lib/rmfakecloud
LOGLEVEL=info

# Set when running behind a TLS reverse proxy
#RM_HTTPS_COOKIE=1
#RM_TRUST_PROXY=1

# Handwriting recognition via MyScript
#RMAPI_HWR_APPLICATIONKEY=
#RMAPI_HWR_HMAC=

# Outgoing mail ("send by email" from the tablet)
#RM_SMTP_SERVER=smtp.example.com:465
#RM_SMTP_USERNAME=
#RM_SMTP_PASSWORD=
#RM_SMTP_FROM=
